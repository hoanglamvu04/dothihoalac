name: Deploy DTHL API VPS

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_DTHL_API to confirm the manual VPS deploy'
        required: true
        type: string

concurrency:
  group: deploy-dthl-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY_DTHL_API" ]; then
            echo "Manual dispatch rejected: confirmation text is incorrect."
            exit 1
          fi

      - name: Deploy Backend VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/dothihoalac
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            git fetch origin main
            # deploy.sh used to be an untracked VPS-only file. Remove that stale
            # copy so the tracked fail-safe script from main can replace it.
            rm -f server/deploy.sh
            git reset --hard origin/main
            export DTHL_PREVIOUS_COMMIT="$PREVIOUS_COMMIT"
            cd server
            bash ./deploy.sh
