name: Backup DTHL MongoDB

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BACKUP_DTHL_DB to confirm the manual backup'
        required: true
        type: string

concurrency:
  group: deploy-dthl-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "BACKUP_DTHL_DB" ]; then
            echo "Manual dispatch rejected: confirmation text is incorrect."
            exit 1
          fi

      - name: Create MongoDB backup on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/dothihoalac
            git fetch origin main
            git reset --hard origin/main
            cd server
            bash ./scripts/backup-mongodb.sh
