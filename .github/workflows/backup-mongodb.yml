name: Backup DTHL MongoDB

on:
  # Automatically verify backup after workflow/script changes on main.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backup-mongodb.yml'
      - 'server/scripts/backup-mongodb.sh'
      - 'server/scripts/ensure-mongodb-database-tools.sh'
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BACKUP_DTHL_DB to confirm the manual backup'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-dthl-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "BACKUP_DTHL_DB" ]; then
            echo "Manual dispatch rejected: confirmation text is incorrect."
            exit 1
          fi

      - name: Create MongoDB backup on VPS
        id: backup
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            # Keep the MongoDB Server and all production data untouched.
            # Install only the official pinned Database Tools when absent.
            cd /var/www/dothihoalac/server
            bash ./scripts/ensure-mongodb-database-tools.sh
            bash ./scripts/backup-mongodb.sh

      - name: Open or update backup alert
        if: steps.backup.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[AUTO] DTHL MongoDB backup failed';
            const body = [
              'Scheduled MongoDB backup failed.',
              '',
              '- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              '- Checked at: ' + new Date().toISOString(),
              '',
              'First check the SSH configuration and the step logs. On VPS, mongodump (MongoDB Database Tools) is also required.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close backup alert after recovery
        if: steps.backup.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[AUTO] DTHL MongoDB backup failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: '✅ MongoDB backup recovered at ' + new Date().toISOString() + '.',
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Fail workflow when backup failed
        if: steps.backup.outcome == 'failure'
        shell: bash
        run: |
          echo "MongoDB backup failed."
          exit 1
