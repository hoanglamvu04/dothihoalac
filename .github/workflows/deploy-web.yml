name: Deploy DTHL Frontend VPS

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_DTHL_WEB to confirm the manual VPS deploy'
        required: true
        type: string

concurrency:
  group: deploy-dthl-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY_DTHL_WEB" ]; then
            echo "Manual dispatch rejected: confirmation text is incorrect."
            exit 1
          fi

      - name: Deploy Frontend VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/dothihoalac
            git fetch origin main
            git reset --hard origin/main

            echo "===== DTHL FRONTEND SERVING DIAGNOSTICS ====="
            echo "[repo]"
            pwd
            git rev-parse --short HEAD

            echo "[nginx sites mentioning dothihoalac.vn]"
            grep -RInE "server_name[^;]*dothihoalac\\.vn|root[[:space:]]+" \
              /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true

            echo "[candidate frontend roots]"
            for dir in \
              /var/www/dothihoalac/client/dist \
              /var/www/dothihoalac/frontend/dist \
              /var/www/dothihoalac/dist \
              /var/www/html; do
              if [ -d "$dir" ]; then
                echo "--- $dir"
                ls -lah "$dir" | head -n 12 || true
                find "$dir/assets" -maxdepth 1 -type f \
                  \( -name 'VerifyPhonePage-*.js' -o -name 'PropertyStudioAdapter-*.js' \) \
                  -printf '%f\n' 2>/dev/null | sort || true
              fi
            done

            echo "[live homepage asset references before deploy]"
            curl -LfsS "https://dothihoalac.vn/?deploy_diag=$(date +%s)" \
              | grep -oE '/assets/[^"[:space:]]+\\.(js|css)' \
              | head -n 20 || true

            cd client
            bash ./deploy.sh

            echo "[live lazy assets after deploy]"
            for asset in dist/assets/VerifyPhonePage-*.js dist/assets/PropertyStudioAdapter-*.js; do
              [ -f "$asset" ] || continue
              name="$(basename "$asset")"
              echo "LOCAL $name $(sha256sum "$asset" | awk '{print $1}')"
              if curl -LfsS "https://dothihoalac.vn/assets/$name?deploy_diag=$(date +%s)" \
                -o "/tmp/$name"; then
                echo "LIVE  $name $(sha256sum "/tmp/$name" | awk '{print $1}')"
              else
                echo "LIVE  $name NOT_SERVED"
              fi
              rm -f "/tmp/$name"
            done
