name: DTHL Production Smoke Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check public website
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 15 \
            https://dothihoalac.vn/ | grep -qi '<html'

      - name: Check public API
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(
            curl --fail --silent --show-error \
              --retry 2 --retry-all-errors \
              --max-time 15 \
              https://api.dothihoalac.vn/api/v1/health
          )"
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"'
