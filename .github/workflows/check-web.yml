name: Check DTHL Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/check-web.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/check-web.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Test article image visibility
        run: node --test tests/articleMedia.test.mjs
        working-directory: client

      - name: Build full frontend
        # PRs validate the app even when production APIs return no dynamic sitemap URLs.
        # Production main/deploy remains strict.
        env:
          SITEMAP_ALLOW_STATIC_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: npm run build
        working-directory: client
