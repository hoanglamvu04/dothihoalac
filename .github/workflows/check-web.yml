name: Check DTHL Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/check-web.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/check-web.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Test article images and featured news
        run: node --test tests/articleMedia.test.mjs tests/homeHero.test.mjs tests/propertyMap.test.mjs tests/sitemapOutputDir.test.mjs tests/savedSearchMatch.test.mjs tests/notificationNavigation.test.mjs
        working-directory: client

      - name: Validate safe production sitemap refresh script
        run: bash -n scripts/refresh-sitemap-production.sh
        working-directory: client
      - name: Build full frontend
        # CI validates static sitemap structure independently from public API uptime.
        # VPS release builds use the loopback API for dynamic sitemap content.
        env:
          SITEMAP_ALLOW_STATIC_ONLY: 'true'
          SITEMAP_SKIP_DYNAMIC_FETCH: 'true'
        run: npm run build
        working-directory: client
