          src/components/forms/PropertyGalleryUploader.jsx
      - name: Test article images and featured news
        run: node --test tests/articleMedia.test.mjs tests/homeHero.test.mjs tests/propertyMap.test.mjs tests/sitemapOutputDir.test.mjs tests/savedSearchMatch.test.mjs tests/notificationNavigation.test.mjs tests/xhubWa002.test.mjs

      - name: Validate safe production sitemap refresh script
        run: bash -n scripts/refresh-sitemap-production.sh
      - name: Build frontend
        env:
          SITEMAP_ALLOW_STATIC_ONLY: 'true'
          SITEMAP_SKIP_DYNAMIC_FETCH: 'true'
        run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
