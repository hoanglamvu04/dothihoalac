name: DTHL application checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      # package.json hiện đi trước package-lock ở client; dùng install để kiểm tra
      # source và production bundle mà không để lockfile cũ chặn CI.
      - run: npm install --no-audit --no-fund
      - name: Lint changed application surfaces
        run: >-
          npx eslint
          src/main.jsx
          src/api/admin.api.js
          src/api/content.api.js
          src/api/interaction.api.js
          src/api/system.api.js
          src/api/user.api.js
          src/api/weather.api.js
          src/app/App.jsx
          src/components/account/AccountContentNav.jsx
          src/components/ads/AdSlot.jsx
          src/components/community/DeferredCommunityQuickComposer.jsx
          src/components/content/ArticleBody.jsx
          src/components/content/ArticleCard.jsx
          src/components/content/ContentImage.jsx
          src/components/content/NewsContextRail.jsx
          src/components/content/ReactionBar.jsx
          src/components/layout/AccountLayout.jsx
          src/components/layout/AdminLayout.jsx
          src/components/layout/PublicLayout.jsx
          src/components/studio/ContentEditorShell.jsx
          src/context/AuthContext.jsx
          src/context/TaxonomyContext.jsx
          src/hooks/useListPage.js
          src/pages/account/ActivityPage.jsx
          src/pages/account/MyContentPage.jsx
          src/pages/account/NotificationsPage.jsx
          src/pages/account/SessionsPage.jsx
          src/pages/admin/AdminDashboardPage.jsx
          src/pages/admin/AdminProjectsPage.jsx
          src/pages/admin/ArticleWorkspacePage.jsx
          src/pages/admin/GoogleDocsArticleLauncher.jsx
          src/pages/admin/ProjectWorkspacePage.jsx
          src/pages/create/CommunityStudioPage.jsx
          src/pages/create/ContentStudioEntryPage.jsx
          src/pages/create/CreateHubPage.jsx
          src/pages/create/JobStudioPage.jsx
          src/pages/create/PropertyStudioAdapter.jsx
          src/pages/public/ArticleDetailPage.jsx
          src/pages/public/ArticlesPage.jsx
          src/pages/public/HomePage.jsx
          src/pages/public/SearchPage.jsx
          src/utils/content.js
          src/utils/projects.js
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: content-studio-v2-access-secret-000000000000000000000000
      JWT_REFRESH_SECRET: content-studio-v2-refresh-secret-00000000000000000000000
      ADMIN_PASSWORD: content-studio-v2-admin-password
      UPLOAD_PROVIDER: local
      CLOUDINARY_URL: cloudinary://123456789012345:test-api-secret@content-studio-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Lint changed server surfaces
        run: >-
          npx eslint
          src/constants/notificationTypes.js
          src/services/notification.service.js
          src/services/userActivity.service.js
          src/modules/auth/auth.controller.js
          src/modules/notifications/notification.service.js
          src/modules/comments/comment.model.js
          src/modules/comments/comment.service.js
          src/modules/reactions/reaction.service.js
          src/modules/follows/follow.service.js
          src/modules/search/search.controller.js
          src/modules/search/search.routes.js
          src/modules/search/search.service.js
          src/jobs/expirePropertyListings.job.js
          src/jobs/expireJobPosts.job.js
          src/jobs/publishScheduledContent.job.js
          src/utils/sanitizeHtml.js
          src/modules/contents/content.model.js
          src/modules/contents/contentDraft.controller.js
          src/modules/contents/contentDraft.routes.js
          src/modules/contents/contentDraft.service.js
          src/modules/contents/contentDraft.validation.js
          src/modules/contents/pendingContentPreview.middleware.js
          src/modules/community/community.controller.js
          src/modules/community/community.compactList.service.js
          src/modules/properties/property.controller.js
          src/modules/properties/property.routes.js
          src/modules/properties/property.service.js
          src/modules/properties/property.publicList.service.js
          src/modules/properties/propertyListing.model.js
          src/modules/jobs/job.controller.js
          src/modules/jobs/job.service.js
          src/modules/jobs/job.publicList.service.js
          src/modules/jobs/jobPost.model.js
          src/modules/articles/article.controller.js
          src/modules/articles/article.model.js
          src/modules/articles/article.routes.js
          src/modules/articles/article.validation.js
          src/modules/articles/article.metadata.service.js
          src/modules/projects/project.model.js
          src/modules/projects/project.validation.js
          src/modules/projects/project.service.js
          src/modules/projects/project.controller.js
          src/modules/projects/project.routes.js
          src/modules/projects/project.admin.routes.js
          src/modules/system/homeFeed.service.js
          src/modules/system/system.controller.js
          src/modules/system/system.routes.js
          src/modules/users/user.controller.js
          src/modules/users/user.routes.js
          src/modules/users/user.service.js
          src/modules/users/userActivity.model.js
          src/routes/index.js
      - run: npm test
