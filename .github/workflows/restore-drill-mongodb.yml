name: DTHL Isolated MongoDB Restore Drill

on:
  # Manual only: restores private backup data inside a throwaway container
  # on the VPS. Never runs automatically after a deploy.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ISOLATED_DTHL_RESTORE to verify a backup safely'
        required: true
        type: string
      mongo_image:
        description: 'Match the source MongoDB server major version'
        required: true
        type: choice
        default: 'mongo:8.0'
        options:
          - 'mongo:6.0'
          - 'mongo:7.0'
          - 'mongo:8.0'

permissions:
  contents: read

# Avoid running a disk/CPU-intensive restore drill during an active deploy.
concurrency:
  group: deploy-dthl-production
  cancel-in-progress: false

jobs:
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate explicit restore drill confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "ISOLATED_DTHL_RESTORE" ]; then
            echo 'Restore drill confirmation rejected'
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Validate restore drill shell syntax
        run: bash -n server/scripts/restore-mongodb-isolated.sh

      - name: Restore the latest archive inside a network-isolated disposable MongoDB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -Eeuo pipefail
            cd /var/www/dothihoalac/server
            DTHL_RESTORE_DRILL_CONFIRM=ISOLATED_DTHL_RESTORE \
              DTHL_RESTORE_DRILL_MONGO_IMAGE='${{ inputs.mongo_image }}' \
              bash ./scripts/restore-mongodb-isolated.sh
