name: DTHL Production Sitemap Refresh

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Deploy Do Thi Hoa Lac VPS'
    types:
      - completed

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-dthl-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh sitemap on the production VPS
        id: refresh
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd /var/www/dothihoalac
            bash client/scripts/refresh-sitemap-production.sh

      - name: Open or update sitemap refresh alert
        if: steps.refresh.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[AUTO] DTHL sitemap refresh failed';
            const body = [
              'The scheduled public sitemap refresh failed; the previously deployed sitemap is retained.',
              '',
              '- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              '- Checked: ' + new Date().toISOString(),
              '- Check API readiness, dynamic content endpoints and sitemap generation logs.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close sitemap refresh alert on recovery
        if: steps.refresh.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[AUTO] DTHL sitemap refresh failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Sitemap refresh recovered at ' + new Date().toISOString(),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Fail workflow when production refresh failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Sitemap refresh failed; previous public sitemap is preserved'
          exit 1
