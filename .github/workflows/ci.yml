name: CI

on:
  push:
    branches:
      - main
      - 'upgrade/**'
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Check client
        working-directory: client
        run: npm run check

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Syntax-check content studio backend
        working-directory: server
        run: |
          node --check src/modules/articles/article.admin-detail.js
          node --check src/modules/googleWorkspace/googleWorkspace.model.js
          node --check src/modules/googleWorkspace/googleWorkspace.service.js
          node --check src/modules/googleWorkspace/googleWorkspace.routes.js
          node --check src/routes/index.js
